services:
  - type: web
    name: streetcred-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: streetcred_backend/backend/streetcred
    buildCommand: |
      pip install uv
      uv sync
      uv run python manage.py collectstatic --no-input
      uv run python manage.py migrate
    startCommand: uv run gunicorn streetcred.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: DEBUG
        value: False
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false  # Set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Set manually in Render dashboard
